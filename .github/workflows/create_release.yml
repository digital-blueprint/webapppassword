name: "🗃️ Sign and publish release"

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  validate:
    name: "🔢 Validate release inputs"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version, changelog and runtime files
        id: metadata
        run: |
          python3 -m unittest discover -s tests/release
          VERSION=$(python3 scripts/check-release.py --notes-output release-notes.md)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/test.yml

  format:
    needs: validate
    uses: ./.github/workflows/format-check.yml

  sign:
    name: "🔐 Sign and verify exact archive"
    needs: [validate, tests, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sign, install and check integrity
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: sh scripts/ci-sign-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-${{ github.sha }}
          path: |
            build/webapppassword-${{ needs.validate.outputs.version }}.tar.gz
            build/webapppassword-${{ needs.validate.outputs.version }}.tar.gz.sig
            build/webapppassword-${{ needs.validate.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  github:
    name: "🚀 Publish GitHub release"
    needs: [validate, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - name: Publish verified archive with changelog description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-github-release.py --commit "$GITHUB_SHA"

  appstore:
    name: "☁️ Publish Nextcloud App Store release"
    needs: [validate, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - name: Submit public URL and existing archive signature
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/publish-appstore.py \
            --download-url "https://github.com/$RELEASE_REPOSITORY/releases/download/v$RELEASE_VERSION/webapppassword-$RELEASE_VERSION.tar.gz" \
            --signature "build/webapppassword-$RELEASE_VERSION.tar.gz.sig" \
            --archive "build/webapppassword-$RELEASE_VERSION.tar.gz"
