<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebAppPassword Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #172435; font: 16px/1.5 system-ui, sans-serif; }
        main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
        h1 { margin: 0 0 20px; font-size: 2.5rem; }
        h2 { margin: 0 0 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; }
        input, textarea { width: 100%; padding: 8px 12px; border: 1px solid #adb5bd; border-radius: 4px; }
        input, button { font: inherit; }
        textarea { height: 64px; }
        #selected-files { height: 80px; }
        #output2 { height: 260px; }
        .form-group { margin-bottom: 16px; }
        .mt-3 { margin-top: 16px; }
        .btn { padding: 8px 14px; border: 0; border-radius: 4px; background: #005b9f; color: white; cursor: pointer; }
        .btn-secondary { background: #46566a; }
        .hidden { display: none; }
    </style>
</head>
<body>
<header>
</header>
<main>
    <div class="container-fluid">
        <h1>WebAppPassword Demo</h1>

        <div class="form-group">
            <label for="app-url">App url</label>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="app-url" aria-describedby="basic-addon3" name="app-url" value="http://localhost:8081/index.php/apps/webapppassword">
            </div>
        </div>
        <div class="form-group">
            <label for="webdav-url">WebDAV base url</label>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="webdav-url" aria-describedby="basic-addon3" name="webdav-url" value="http://localhost:8081/remote.php/dav/files">
            </div>
        </div>

        <div class="form-group">
            <label for="expected-uid">Expected Nextcloud UID (optional, for WebDAV response)</label>
            <input type="text" id="expected-uid">
        </div>
        <button onclick="openFilePicker()" class="btn btn-primary">Open WebDAV file picker</button>
        <button onclick="login()" class="btn btn-secondary">Show WebDAV response</button>
        <div class="form-group mt-3">
            <label for="selected-files">Selected file(s)</label>
            <textarea class="form-control" id="selected-files" readonly aria-live="polite" placeholder="No files selected"></textarea>
        </div>
    </div>
    <div class="container-fluid hidden" id="output-area">
        <h2>Output</h2>
        <div class="form-group">
            <label for="output">Output from WebAppPassword</label>
            <div class="input-group mb-3">
                <textarea id="output" readonly></textarea>
            </div>
        </div>
        <div class="form-group">
            <label for="output2">Example WebDAV fetch</label>
            <div class="input-group mb-3">
                <textarea id="output2" readonly></textarea>
            </div>
        </div>
    </div>

    <!-- see https://github.com/digital-blueprint/toolkit/tree/main/packages/file-handling#filesource -->
    <dbp-file-source
            id="file-source"
            lang="en"
            enabled-sources="nextcloud"></dbp-file-source>
</main>
<footer></footer>
</body>
<script>
    let wnd = null;
    let pendingLogin = null;
    const outputArea = document.querySelector("#output-area");
    const output = document.querySelector("#output");
    const output2 = document.querySelector("#output2");
    const appUrl = document.querySelector("#app-url");
    const webdavUrl = document.querySelector("#webdav-url");
    const expectedUidInput = document.querySelector("#expected-uid");
    const fileSource = document.querySelector("#file-source");
    const selectedFiles = document.querySelector("#selected-files");
    let selectedFileNames = [];

    function login() {
        outputArea.classList.remove("hidden");
        output.value = "";
        output2.value = "";

        // open auth window of WebAppPassword application
        const authUrl = new URL(appUrl.value);
        const expectedUid = expectedUidInput.value;
        authUrl.searchParams.set("target-origin", window.location.origin);
        authUrl.searchParams.delete("expected-uid");
        if (expectedUid !== "") {
            authUrl.searchParams.set("expected-uid", expectedUid);
        }
        pendingLogin = { origin: authUrl.origin, expectedUid };
        wnd = window.open(authUrl, "WebAppPassword demo login",
            "width=400,height=400,menubar=no,scrollbars=no,status=no,titlebar=no,toolbar=no");
    }

    function openFilePicker() {
        outputArea.classList.add("hidden");
        selectedFileNames = [];
        selectedFiles.value = "";
        fileSource.setAttribute("nextcloud-auth-url", appUrl.value);
        fileSource.setAttribute("nextcloud-web-dav-url", webdavUrl.value);
        fileSource.setAttribute("dialog-open", "");
    }

    fileSource.addEventListener("dbp-file-source-file-selected", (event) => {
        selectedFileNames.push(event.detail.file.name);
        selectedFiles.value = selectedFileNames.join("\n");
    });

    // receives the "window.opener.postMessage" from https://github.com/digital-blueprint/webapppassword/blob/main/js/script.js
    window.addEventListener('message', (event) => {
        if (!pendingLogin || !wnd || event.source !== wnd || event.origin !== pendingLogin.origin) {
            return;
        }
        const data = event.data;

        if (data?.type === "webapppassword-error" && data.error === "account_mismatch") {
            pendingLogin = null;
            output.value = "Switch to the expected Nextcloud account and retry.";
        }
        if (data?.type === "webapppassword") {
            const { expectedUid } = pendingLogin;
            pendingLogin = null;
            wnd.close();
            if (expectedUid !== "" && data.uid !== expectedUid) {
                output.value = "The Nextcloud account could not be verified.";
                return;
            }

            output.value = JSON.stringify(data);

            // set auth header from data received by WebAppPassword application
            let headers = new Headers();
            headers.set('Authorization', 'Basic ' + btoa(data.loginName + ":" + data.token));

            // do PROPFIND WebDAV request
            fetch(data.webdavUrl || webdavUrl.value + "/" + data.loginName, {
                method: 'PROPFIND', // *GET, POST, PUT, DELETE, etc.
                cache: 'no-cache', // *default, no-cache, reload, force-cache, only-if-cached
                headers: headers
            })
                .then(result => {
                    if (!result.ok) throw result;

                    return result.text();
                })
                .then((xml) => {
                    output2.value = xml;
                }).catch(error => {
                    output2.value = error.message;
                    console.error(error);
                });
        }
    });
</script>
<script type="module" src="dist/dbp-file-source.js"></script>
</html>
